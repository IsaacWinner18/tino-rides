<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Mask so receipt border is clipped behind the NO badge with 0 bleed -->
    <mask id="receipt-mask">
      <rect width="64" height="64" fill="white" />
      <circle cx="21" cy="23" r="10.5" fill="black" />
    </mask>
  </defs>

  <!-- Receipt paper (clipped behind NO badge) -->
  <g mask="url(#receipt-mask)" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Receipt outline with dog-ear fold and scalloped bottom -->
    <path d="M28 20h18l8 8v24l-3.5-2.5-3.5 2.5-3.5-2.5-3.5 2.5-3.5-2.5-3.5 2.5-3.5-2.5-3.5 2.5V20" />
    <!-- Dog-ear fold triangle -->
    <path d="M46 20v8h8" />

    <!-- Currency circle -->
    <circle cx="41" cy="33.5" r="5" stroke-width="1.8" />
  </g>

  <!-- Dollar symbol text -->
  <text x="41" y="36.8" font-size="8.5" font-family="Plus Jakarta Sans, sans-serif" font-weight="bold" text-anchor="middle" fill="white" stroke="none">$</text>

  <!-- FEE text -->
  <text x="41" y="47.5" font-size="8" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" letter-spacing="0.5" text-anchor="middle" fill="white" stroke="none">FEE</text>

  <!-- Overlapping NO circle stamp badge -->
  <g stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="21" cy="23" r="9.5" />
  </g>
  <text x="21" y="27" font-size="9.5" font-family="Plus Jakarta Sans, sans-serif" font-weight="900" letter-spacing="-0.3" text-anchor="middle" fill="white" stroke="none">NO</text>
</svg>

