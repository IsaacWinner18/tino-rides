<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Mask so gear cog is cleanly hidden behind stopwatch body with 0 bleed -->
    <mask id="stopwatch-mask">
      <rect width="64" height="64" fill="white" />
      <circle cx="37" cy="39" r="16.5" fill="black" />
    </mask>
  </defs>

  <!-- Gear wheel behind stopwatch (clipped by stopwatch mask) -->
  <g mask="url(#stopwatch-mask)" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Gear outer teeth -->
    <path d="M21 16l-2 2-3 .5-.8 3-2.6 1.4.2 3-2 2 1.2 2.8-.8 2.8 2 2 2.8-.3 2.5 1.5" />
    <!-- Gear inner hub circle -->
    <circle cx="21" cy="25" r="4.5" />
  </g>

  <!-- Stopwatch Body & Dial -->
  <g stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top stem & crown button -->
    <line x1="37" y1="17.5" x2="37" y2="23" stroke-width="2.5" />
    <line x1="33" y1="17.5" x2="41" y2="17.5" stroke-width="2.5" />

    <!-- Angled lap button at ~2 o'clock -->
    <line x1="47.5" y1="23.5" x2="51" y2="20" stroke-width="2.2" />

    <!-- Outer stopwatch dial ring -->
    <circle cx="37" cy="39" r="16" />

    <!-- Cardinal Face Ticks -->
    <line x1="37" y1="25.5" x2="37" y2="28.5" stroke-width="1.8" />
    <line x1="50.5" y1="39" x2="47.5" y2="39" stroke-width="1.8" />
    <line x1="37" y1="52.5" x2="37" y2="49.5" stroke-width="1.8" />
    <line x1="23.5" y1="39" x2="26.5" y2="39" stroke-width="1.8" />

    <!-- Intermediate Sub-ticks -->
    <line x1="46" y1="30" x2="44" y2="32" stroke-width="1.3" />
    <line x1="46" y1="48" x2="44" y2="46" stroke-width="1.3" />
    <line x1="28" y1="48" x2="30" y2="46" stroke-width="1.3" />
    <line x1="28" y1="30" x2="30" y2="32" stroke-width="1.3" />

    <!-- Center pin hub -->
    <circle cx="37" cy="39" r="1.8" fill="white" stroke="none" />

    <!-- Clock hands set to 10:10 -->
    <line x1="37" y1="39" x2="31" y2="32.5" stroke-width="2.2" />
    <line x1="37" y1="39" x2="45.5" y2="30.5" stroke-width="2" />
  </g>
</svg>

