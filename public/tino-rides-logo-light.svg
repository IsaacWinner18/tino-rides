  </defs>

  <!-- Left Icon Emblem Badge -->
  <g transform="translate(6, 6)">
    <circle cx="39" cy="39" r="37" fill="#0f172a" stroke="url(#hChrome_light)" stroke-width="1.8" />
    <circle cx="39" cy="39" r="33" fill="none" stroke="url(#hBlue_light)" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="3 3" />
    
    <!-- Wings -->
    <path d="M 18 27 C 25 23, 34 24, 38 26 L 37 31 C 32 29, 26 28, 21 31 Z" fill="url(#hChrome_light)" />
    <path d="M 22 35 C 28 32, 34 33, 38 35 L 37 39 C 33 37, 28 37, 24 40 Z" fill="url(#hBlue_light)" />
    <path d="M 60 27 C 53 23, 44 24, 40 26 L 41 31 C 46 29, 52 28, 57 31 Z" fill="url(#hChrome_light)" />
    <path d="M 56 35 C 50 32, 44 33, 40 35 L 41 39 C 45 37, 50 37, 54 40 Z" fill="url(#hBlue_light)" />

    <!-- Center T -->
    <polygon points="39,18 43,22 39,24 35,22" fill="url(#hBlue_light)" />
    <path d="M 28 22 L 39 24 L 39 27 L 31 26 Z" fill="#ffffff" />
    <path d="M 39 24 L 50 22 L 47 26 L 39 27 Z" fill="#94a3b8" />
    <polygon points="37,27 39,27 39,52 36,54 35,46" fill="url(#hChrome_light)" />
    <polygon points="39,27 41,27 43,46 42,54 39,52" fill="url(#hBlue_light)" />
    <polygon points="36,54 39,52 42,54 39,59" fill="#38bdf8" />
  </g>

  <!-- Typography: TINO RIDES -->
  <text x="100" y="49" font-family="'Poppins', 'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="900" letter-spacing="1">
    <tspan fill="#0a0d14">TINO</tspan>
    <tspan dx="8" fill="#3b82f6">RIDES</tspan>
  </text>
  
  <!-- Subtitle Tagline -->
  <text x="102" y="70" font-family="'Poppins', 'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#64748b" letter-spacing="3.5">
